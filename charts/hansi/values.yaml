# The review service: a queue worker with no inbound traffic. The port serves health checks only,
# so the chart creates no Service.

image:
  repository: ghcr.io/appwrite-labs/hansi
  # Defaults to the chart's appVersion.
  tag: ''
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 2
# Jobs one pod runs at once. Each holds a checkout on /tmp and may hold a sandbox.
concurrency: 4
logLevel: info

appwrite:
  # The Appwrite API, e.g. http://appwrite/v1, serving the internal Reviews API.
  endpoint: ''
queue:
  # Appwrite's reviews queue. The connection URL is a secret (see existingSecret).
  name: v1-reviews
orchestrator:
  endpoint: ''
  # The image sandboxes run, with the toolchains reviews run commands with.
  sandboxImage: ''
models:
  # AI SDK model ids, e.g. anthropic/claude-sonnet-4.5 through the AI Gateway.
  review: ''
  # Defaults to the review model.
  verify: ''

# A Secret the pods load as environment, which holds:
#   HANSI_APPWRITE_SECRET   Appwrite's _APP_REVIEWS_SECRET
#   HANSI_QUEUE_URL         nats://user:pass@host:4222, as in _APP_CONNECTIONS_QUEUE
#   HANSI_ORCHESTRATOR_KEY  optional, the orchestrator's API key
#   AI_GATEWAY_API_KEY      the model provider's key
existingSecret: ''

# Extra environment, as container env entries.
extraEnv: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

# Checkouts of reviewed repositories. Partial clones, but a large repository still takes room.
tmp:
  sizeLimit: 10Gi

# A pod that is told to stop finishes its running jobs first. A review can take several minutes,
# and a repository's setup command up to fifteen; past this, the jobs go back to the queue.
terminationGracePeriodSeconds: 1200

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
