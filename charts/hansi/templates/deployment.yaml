apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hansi.fullname" . }}
  labels:
    {{- include "hansi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hansi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hansi.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # The service calls no Kubernetes API.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hansi
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HANSI_PORT
              value: "8080"
            - name: HANSI_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: HANSI_CONCURRENCY
              value: {{ .Values.concurrency | quote }}
            - name: HANSI_APPWRITE_ENDPOINT
              value: {{ required "appwrite.endpoint is required" .Values.appwrite.endpoint | quote }}
            - name: HANSI_QUEUE_NAME
              value: {{ .Values.queue.name | quote }}
            - name: HANSI_ORCHESTRATOR_ENDPOINT
              value: {{ required "orchestrator.endpoint is required" .Values.orchestrator.endpoint | quote }}
            - name: HANSI_SANDBOX_IMAGE
              value: {{ required "orchestrator.sandboxImage is required" .Values.orchestrator.sandboxImage | quote }}
            - name: HANSI_REVIEW_MODEL
              value: {{ required "models.review is required" .Values.models.review | quote }}
            {{- with .Values.models.verify }}
            - name: HANSI_VERIFY_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ required "existingSecret is required" .Values.existingSecret }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Fails as soon as the pod starts draining.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmp.sizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
