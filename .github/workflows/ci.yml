name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # The engine's grep tool runs ripgrep.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun run test
